 <!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Gráfico Empilhado Simples</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }

    .grafico {
      display: flex;
      align-items: flex-end;
      height: 200px;
      border-left: 1px solid #ccc;
      border-bottom: 1px solid #ccc;
      padding-left: 30px;
      position: relative;
    }

    .barra {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      margin: 0 10px;
      width: 30px;
    }

    .camada1 {
      background-color: #007bff;
    }

    .camada2 {
      background-color: #a6d3ff;
    }

    .label {
      text-align: center;
      margin-top: 5px;
    }

    .eixo-y {
      position: absolute;
      left: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      height: 100%;
      justify-content: space-between;
      font-size: 12px;
      transform: translateY(6px);
    }

    .eixo-y span {
      display: block;
      height: 0;
    }
  </style>
</head>
<body>

<h2>Gráfico Empilhado - JS Puro</h2>

<div class="grafico" id="grafico">
  <div class="eixo-y">
    <span>100%</span>
    <span>75%</span>
    <span>50%</span>
    <span>25%</span>
    <span>0%</span>
  </div>
</div>

<div id="labels" style="display: flex; justify-content: center; gap: 30px; margin-top: 10px;"></div>

<script>
  const dados = [
    { mes: "Jan", parte1: 60, parte2: 40 },
    { mes: "Feb", parte1: 45, parte2: 30 },
    { mes: "Mar", parte1: 35, parte2: 25 },
    { mes: "Apr", parte1: 50, parte2: 30 },
    { mes: "May", parte1: 65, parte2: 20 },
    { mes: "Jun", parte1: 40, parte2: 35 }
  ];

  const grafico = document.getElementById("grafico");
  const labels = document.getElementById("labels");

  dados.forEach(dado => {
    const barra = document.createElement("div");
    barra.className = "barra";

    const camada2 = document.createElement("div");
    camada2.className = "camada2";
    camada2.style.height = `${dado.parte2 * 2}px`;

    const camada1 = document.createElement("div");
    camada1.className = "camada1";
    camada1.style.height = `${dado.parte1 * 2}px`;

    barra.appendChild(camada2);
    barra.appendChild(camada1);
    grafico.appendChild(barra);

    const label = document.createElement("div");
    label.className = "label";
    label.textContent = dado.mes;
    labels.appendChild(label);
  });
</script>

</body>
</html>
